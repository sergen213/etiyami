name: Engine release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag/version to publish; leave empty to verify the selected branch without publishing'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: engine-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Validate and resolve the intended tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$INPUT_VERSION" ]]; then
            commit="$GITHUB_SHA"
            printf 'tag=\nversion=0.0.0\ncommit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'A stable vMAJOR.MINOR.PATCH tag is required.' >&2
            exit 1
          fi
          # Require a real tag for every publishing run. Resolve once; every job checks out this SHA.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .ref
          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'tag=%s\nversion=%s\ncommit=%s\n' "$tag" "${tag#v}" "$commit" >> "$GITHUB_OUTPUT"

  linux:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, arch: x86_64}
          - {runner: ubuntu-22.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      UPDATE_REPO: ${{ github.repository }}
      PKG_CONFIG_PATH: /opt/yami-deps/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/yami-deps/lib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - name: Install baseline toolchain and desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config python3 curl ca-certificates xz-utils bzip2 squashfs-tools \
            nasm patchelf libepoxy-dev libvulkan-dev glslang-tools libxml2-dev libssl-dev libc-ares-dev zlib1g-dev libarchive-dev libjson-c-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Build pinned SDL3, FFmpeg, and asynchronous-DNS curl on glibc 2.35
        shell: bash
        run: |
          set -euo pipefail
          # SHA-pinned genuine releases: SDL 3.4.18, FFmpeg 7.1.5, curl 8.22.0.
          # Jammy's FFmpeg 4.4 lacks AVChannelLayout; curl 7.81 lacks PROTOCOLS_STR.
          mkdir -p "$RUNNER_TEMP/yami-deps"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz \
            --output "$RUNNER_TEMP/yami-deps/SDL3.tar.gz"
          echo "9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3  $RUNNER_TEMP/yami-deps/SDL3.tar.gz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/yami-deps/SDL3.tar.gz" -C "$RUNNER_TEMP/yami-deps"
          cmake -S "$RUNNER_TEMP/yami-deps/SDL3-3.4.18" -B "$RUNNER_TEMP/yami-deps/sdl-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/yami-deps -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/yami-deps/sdl-build" --parallel "$(nproc)"
          sudo cmake --install "$RUNNER_TEMP/yami-deps/sdl-build"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://ffmpeg.org/releases/ffmpeg-7.1.5.tar.xz \
            --output "$RUNNER_TEMP/yami-deps/ffmpeg.tar.xz"
          echo "de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f  $RUNNER_TEMP/yami-deps/ffmpeg.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/yami-deps/ffmpeg.tar.xz" -C "$RUNNER_TEMP/yami-deps"
          pushd "$RUNNER_TEMP/yami-deps/ffmpeg-7.1.5"
          ./configure --prefix=/opt/yami-deps --libdir=/opt/yami-deps/lib \
            --enable-shared --disable-static --enable-pic --disable-autodetect --enable-zlib \
            --disable-programs --disable-doc --disable-avdevice --disable-avfilter \
            --disable-encoders --enable-encoder=png --disable-muxers --disable-network
          make -j"$(nproc)"
          sudo make install
          popd
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://curl.se/download/curl-8.22.0.tar.bz2 \
            --output "$RUNNER_TEMP/yami-deps/curl.tar.bz2"
          echo "5d956a6a22b3c279f50c421ee5d3c9e9d660cb6f115dcf881b579e952130549c  $RUNNER_TEMP/yami-deps/curl.tar.bz2" | sha256sum --check
          tar -xf "$RUNNER_TEMP/yami-deps/curl.tar.bz2" -C "$RUNNER_TEMP/yami-deps"
          pushd "$RUNNER_TEMP/yami-deps/curl-8.22.0"
          ./configure --prefix=/opt/yami-deps --libdir=/opt/yami-deps/lib \
            --enable-shared --disable-static --with-openssl --enable-ares --disable-threaded-resolver \
            --without-libpsl --without-libidn2 \
            --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt --with-ca-path=/etc/ssl/certs
          make -j"$(nproc)"
          sudo make install
          popd
          echo /opt/yami-deps/lib | sudo tee /etc/ld.so.conf.d/yami-release.conf
          sudo ldconfig
          pkg-config --modversion sdl3 libavcodec libcurl libarchive json-c
          pkg-config --atleast-version=7.85.0 libcurl
          /opt/yami-deps/bin/curl --version
          /opt/yami-deps/bin/curl --version | grep -q AsynchDNS
      - name: Build engine and GUI installer (no proprietary assets/tests)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DYAMI_RELEASE_VERSION="$RELEASE_VERSION" -DYAMI_UPDATE_REPO="$UPDATE_REPO" \
            -DBUILD_TESTING=OFF -DYAMI_ENABLE_VULKAN=ON -DYAMI_INSTALL_ORIGINAL_ASSETS=OFF \
            '-DCMAKE_INSTALL_RPATH=$ORIGIN'
          cmake --build build --target yami-native yami-updater yami-launcher yami-setup yami-remove --parallel "$(nproc)"
          cmake --install build --component runtime --prefix "$RUNNER_TEMP/yami-install"
          python3 tools/package_release.py --install-root "$RUNNER_TEMP/yami-install" \
            --platform linux --arch '${{ matrix.arch }}' --version "$RELEASE_VERSION" \
            --linux-glibc-max 2.35 --output 'dist/yami-linux-${{ matrix.arch }}.zip'
          cmake --install build --component setup --prefix "$RUNNER_TEMP/yami-setup-install"
      - name: Bundle the pinned official static archiver and offline GUI installer
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.arch }}' in
            x86_64)
              archive=7z2604-linux-x64.tar.xz
              expected=fc0327ba27e89bd086cf426dff17d77de582953cdbbc10a6576540a06853ffcd
              ;;
            arm64)
              archive=7z2604-linux-arm64.tar.xz
              expected=5b0ac3aa91c1e3499f011d6af69d7f6b4de3ef2f011d9e2ff44c58ebd04aa388
              ;;
          esac
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/ip7z/7zip/releases/download/26.04/$archive" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check
          python3 tools/package_setup.py --setup-binary "$RUNNER_TEMP/yami-setup-install/yami-setup" \
            --engine-archive 'dist/yami-linux-${{ matrix.arch }}.zip' \
            --sevenzip-archive "$RUNNER_TEMP/$archive" --arch '${{ matrix.arch }}' \
            --version "$RELEASE_VERSION" --linux-glibc-max 2.35 \
            --output 'dist/yami-setup-linux-${{ matrix.arch }}.run'
          python3 tools/package_setup.py --self-test --arch '${{ matrix.arch }}' \
            --linux-glibc-max 2.35 --output 'dist/yami-setup-linux-${{ matrix.arch }}.run'
      - name: Build genuine static-runtime AppImage and exercise forced extraction
        shell: bash
        run: |
          set -euo pipefail
          runtime_arch='${{ matrix.arch }}'
          [[ "$runtime_arch" != arm64 ]] || runtime_arch=aarch64
          runtime="uruntime-appimage-squashfs-lite-$runtime_arch"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/VHSgunzo/uruntime/releases/download/v0.8.1/$runtime" \
            --output "$RUNNER_TEMP/$runtime"
          python3 tools/package_appimage.py \
            --setup-archive 'dist/yami-setup-linux-${{ matrix.arch }}.run' \
            --engine-archive 'dist/yami-linux-${{ matrix.arch }}.zip' \
            --runtime-file "$RUNNER_TEMP/$runtime" --arch '${{ matrix.arch }}' \
            --version "$RELEASE_VERSION" --linux-glibc-max 2.35 \
            --output 'dist/yami-setup-linux-${{ matrix.arch }}.AppImage'
          python3 tools/package_appimage.py --self-test \
            --setup-archive 'dist/yami-setup-linux-${{ matrix.arch }}.run' \
            --engine-archive 'dist/yami-linux-${{ matrix.arch }}.zip' \
            --runtime-file "$RUNNER_TEMP/$runtime" --arch '${{ matrix.arch }}' \
            --version "$RELEASE_VERSION" --linux-glibc-max 2.35 \
            --output 'dist/yami-setup-linux-${{ matrix.arch }}.AppImage'
          image="$PWD/dist/yami-setup-linux-${{ matrix.arch }}.AppImage"
          "$image" --appimage-version
          "$image" --appimage-help
          # Exercise the real native AppRun, argv and ../engine layout without a
          # display, FUSE, root, or a real installation. Never use CI's loader override.
          (cd "$RUNNER_TEMP"; env -u LD_LIBRARY_PATH -u LD_PRELOAD \
            REUSE_CHECK_DELAY=0 "$image" --appimage-extract-and-run --help)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/yami-linux-${{ matrix.arch }}.zip
            dist/yami-setup-linux-${{ matrix.arch }}.run
            dist/yami-setup-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
      - name: Install UCRT64 toolchain and dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -S --needed --noconfirm \
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf \
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-sdl3 \
            mingw-w64-ucrt-x86_64-libepoxy mingw-w64-ucrt-x86_64-libxml2 \
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-curl-winssl \
            mingw-w64-ucrt-x86_64-libarchive mingw-w64-ucrt-x86_64-json-c \
            mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-glslang 7zip
      - name: Build engine, installer, and regression checks
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DYAMI_RELEASE_VERSION="$RELEASE_VERSION" -DYAMI_UPDATE_REPO="$UPDATE_REPO" \
            -DBUILD_TESTING=ON -DYAMI_ENABLE_VULKAN=ON -DYAMI_INSTALL_ORIGINAL_ASSETS=OFF
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure -R '^(update|update_install|windows_update_install|windows_setup|windows_uninstall)$'
          build/yami-native.exe --version
      - name: Package and validate engine ZIP and offline GUI installer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --install build --component runtime --prefix "$RUNNER_TEMP/yami-install"
          python tools/package_release.py --install-root "$(cygpath -w "$RUNNER_TEMP/yami-install")" \
            --platform windows --arch x86_64 --version "$RELEASE_VERSION" \
            --search-dir "$(cygpath -w /ucrt64/bin)" --output 'dist/yami-windows-x86_64.zip'
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/ip7z/7zip/releases/download/26.04/7z2604-x64.exe \
            --output "$RUNNER_TEMP/7z2604-x64.exe"
          echo 'd54bf805f9f3704d1e8db2fa3498ae7ef2df0312b40b558e7c71c734430a665d  '"$RUNNER_TEMP/7z2604-x64.exe" | sha256sum --check
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/ip7z/7zip/releases/download/26.04/lzma2604.7z \
            --output "$RUNNER_TEMP/lzma2604.7z"
          echo 'bd98058d0e12c5da970dd4e5e1d8fa24f2d704914d96e69c28f92ed45421a439  '"$RUNNER_TEMP/lzma2604.7z" | sha256sum --check
          python tools/package_windows_setup.py --setup-binary build/yami-setup.exe \
            --remover-binary build/yami-remove.exe --engine-archive 'dist/yami-windows-x86_64.zip' \
            --sevenzip-installer "$(cygpath -w "$RUNNER_TEMP/7z2604-x64.exe")" \
            --lzma-sdk "$(cygpath -w "$RUNNER_TEMP/lzma2604.7z")" \
            --search-dir "$(cygpath -w /ucrt64/bin)" --arch x86_64 \
            --version "$RELEASE_VERSION" --output 'dist/yami-setup-windows-x86_64.exe'
          python tools/package_windows_setup.py --self-test --arch x86_64 \
            --engine-archive 'dist/yami-windows-x86_64.zip' \
            --output 'dist/yami-setup-windows-x86_64.exe'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x86_64
          path: |
            dist/yami-windows-x86_64.zip
            dist/yami-setup-windows-x86_64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'push' || inputs.version != ''
    needs: [metadata, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Recheck all eight release assets before creating a draft
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y patchelf binutils squashfs-tools p7zip-full
          python3 - <<'PY'
          from pathlib import Path
          expected = {f'yami-linux-{arch}.zip' for arch in ('x86_64', 'arm64')}
          expected |= {f'yami-setup-linux-{arch}.run' for arch in ('x86_64', 'arm64')}
          expected |= {f'yami-setup-linux-{arch}.AppImage' for arch in ('x86_64', 'arm64')}
          expected |= {'yami-windows-x86_64.zip', 'yami-setup-windows-x86_64.exe'}
          actual = {path.name for path in Path('dist').iterdir()}
          if actual != expected:
              raise SystemExit(f'Incomplete release asset set: {actual ^ expected}')
          PY
          for arch in x86_64 arm64; do
            python3 tools/package_release.py --verify-only --platform linux --arch "$arch" \
              --output "dist/yami-linux-$arch.zip"
            python3 tools/package_setup.py --verify-only --arch "$arch" --linux-glibc-max 2.35 \
              --engine-archive "dist/yami-linux-$arch.zip" --output "dist/yami-setup-linux-$arch.run"
            runtime_arch="$arch"
            [[ "$runtime_arch" != arm64 ]] || runtime_arch=aarch64
            runtime="uruntime-appimage-squashfs-lite-$runtime_arch"
            curl --fail --location --proto '=https' --tlsv1.2 \
              "https://github.com/VHSgunzo/uruntime/releases/download/v0.8.1/$runtime" \
              --output "$RUNNER_TEMP/$runtime"
            python3 tools/package_appimage.py --verify-only --arch "$arch" --linux-glibc-max 2.35 \
              --version '${{ needs.metadata.outputs.version }}' \
              --runtime-file "$RUNNER_TEMP/$runtime" \
              --setup-archive "dist/yami-setup-linux-$arch.run" \
              --engine-archive "dist/yami-linux-$arch.zip" --output "dist/yami-setup-linux-$arch.AppImage"
          done
          python3 tools/package_release.py --verify-only --platform windows --arch x86_64 \
            --output dist/yami-windows-x86_64.zip
          python3 tools/package_windows_setup.py --verify-only --arch x86_64 \
            --engine-archive dist/yami-windows-x86_64.zip \
            --output dist/yami-setup-windows-x86_64.exe
      - name: Upload complete draft, verify GitHub SHA256 digests, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          [[ "$current" == "$RELEASE_COMMIT" ]] || { echo 'Release tag moved during build.' >&2; exit 1; }
          # A failed upload stays draft. Existing releases are never overwritten by this workflow.
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "ETI Yami $RELEASE_TAG" \
            --notes-file - <<'RELEASE_NOTES'
          ## v1.3.0 native Windows release

          - Native 64-bit Windows joins Linux with the same C++20/SDL3 game, settings launcher, original assets, checkpoints, OpenGL/GLES rendering, Vulkan 1.3, optional ray-query effects, AMD FSR 3.1.4 upscaling and optional frame generation. OpenGL remains the default; enhanced character shadows, widescreen and classic graphics are retained.
          - The single-file Windows installer reads your legally owned original ISO offline, shows its artwork, installs per user without administrator rights, creates Start Menu and optional Desktop play/uninstall shortcuts, and preserves saves, settings and unrecorded files on repair/uninstall. The engine ZIP supports manual installations and automatic updates.
          - Windows update ZIPs stay flat and contain only engine executables/runtime DLLs. The pinned FidelityFX MIT notice is embedded in yami-native.exe and included readably in the installer. Windows packages are unsigned, so SmartScreen can report an unknown publisher.
          - Vulkan/FSR feature availability remains GPU/driver dependent. Frame generation is off by default; alpha-blended sprites can smear in generated frames, and no motion-quality or performance guarantee is claimed.

          ## Windows download and installation

          Download yami-setup-windows-x86_64.exe for 64-bit Windows 10/11, run it as your normal user, choose the original Turkish Yami ISO, then Install game and Launch game. Installation defaults to %LOCALAPPDATA%\\Programs\\etiyami. No Wine, DirectX/codec installer, separately installed 7-Zip, admin rights, or manual asset extraction is needed. The original assets are not distributed. Native Windows CI builds and regression/package checks do not establish compatibility with every GPU or a complete campaign playthrough.

          ## Linux downloads and installation

          Six assets cover Linux x86_64 and ARM64: engine/launcher ZIPs, offline GUI .run installers and .AppImage installers. They provide the same v1.2.x graphics and updater functionality as before, including the flat update layout compatible with installed v1.2.0 launchers. Installers accept the original ISO offline and create application-menu plus optional Desktop entries; no original assets or saves are bundled.

          Requires glibc 2.35+ and host graphics drivers; no sudo, Wine or manual application dependencies. Physical ARM64 GPU execution, blanket distribution compatibility and a performance guarantee are not claimed. Vulkan requires a Vulkan 1.3-capable driver; ray-query effects additionally require compatible hardware/driver support. AppImages use a static runtime with extraction fallback when FUSE is unavailable. macOS releases remain deferred.
          RELEASE_NOTES
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.run dist/*.AppImage dist/*.exe
          # Query drafts through REST and keep the numeric ID; draft HTML URLs are not API URLs.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          release_api="repos/$GITHUB_REPOSITORY/releases/$release_id"
          gh api "$release_api" > "$RUNNER_TEMP/yami-release.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'yami-release.json').read_text())
          local = {path.name: 'sha256:' + hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
                   for path in Path('dist').iterdir() if path.is_file()}
          assets = {asset['name']: asset for asset in release['assets']}
          if (not release['draft'] or len(release['assets']) != 8 or len(local) != 8
                  or set(assets) != set(local)):
              raise SystemExit('Release is not a complete draft.')
          for name, expected in local.items():
              asset = assets[name]
              if asset['state'] != 'uploaded' or asset.get('digest') != expected:
                  raise SystemExit(f'GitHub SHA256 validation failed for {name}')
          PY
          gh api --method PATCH "$release_api" -F draft=false -f make_latest=true
